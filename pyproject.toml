[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthflux"
version = "0.1.0"
description = "Reusable Python tools for environmental carbon-flux data processing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Omodara E. Obisesan"}
]
dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
